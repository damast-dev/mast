# Tags the next release candidate (vX.Y.Z-mast.N-rc.M) on main:
# automatically when an upstream sync PR is merged, or by hand after merging mast features.
name: tag-rc

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'upstream-sync'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }} # a tag pushed with GITHUB_TOKEN would not start release.yml
      - name: Tag next RC
        run: |
          if git tag --points-at HEAD | grep -q -- '-mast\.'; then
            echo "main is already tagged: $(git tag --points-at HEAD | tr '\n' ' ')"; exit 0
          fi
          tag=$(.github/scripts/version.sh next-rc)
          git config user.name "mast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "mast $tag"
          git push origin "$tag"
          echo "### Tagged \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
