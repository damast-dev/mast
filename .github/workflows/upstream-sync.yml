# Opens a PR when forgejo-cli publishes a new release on Codeberg.
name: upstream-sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PRs opened with GITHUB_TOKEN don't trigger CI; a PAT in SYNC_TOKEN fixes that.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Find newest forgejo-cli tag
        id: tag
        run: |
          git remote add upstream https://codeberg.org/forgejo-contrib/forgejo-cli.git
          tag=$(git ls-remote --tags --refs upstream 'v*' | awk -F/ '{print $3}' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          git fetch --no-tags upstream "refs/tags/$tag:refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$tag" origin/main; then
            echo "Already on $tag"; echo "new=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code origin "refs/heads/sync/$tag" >/dev/null; then
            echo "sync/$tag already open"; echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge and open PR
        if: steps.tag.outputs.new == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          git config user.name "mast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "sync/$TAG" origin/main
          if git merge --no-edit -m "Merge forgejo-cli $TAG" "$TAG"; then
            note="Merged cleanly. Review CI, then merge (no squash, keep upstream history)."
          else
            # Conflict: push the bare upstream tag; GitHub shows the conflicts, resolve locally.
            git merge --abort
            git reset --hard "$TAG"
            note="**Merge conflicts.** Resolve locally: \`git fetch origin && git switch sync/$TAG && git merge origin/main\`, fix, push."
          fi
          git push origin "sync/$TAG"
          gh pr create --base main --head "sync/$TAG" --label upstream-sync \
            --title "Sync forgejo-cli $TAG" \
            --body "Upstream release: https://codeberg.org/forgejo-contrib/forgejo-cli/releases/tag/$TAG

          $note

          Checklist: mast patches (DAMAST: markers) still apply, `mast` binary builds, fj config stays compatible."
